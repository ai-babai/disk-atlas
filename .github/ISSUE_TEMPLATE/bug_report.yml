name: Bug report
description: Report a reproducible problem without private scan data.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version, macOS version and chip
      placeholder: Disk Atlas 0.3.2, macOS 15, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result and actual result
      description: Use synthetic paths. Do not attach real snapshots or history archives.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed personal paths, file names and credentials from this report and screenshots.
          required: true
