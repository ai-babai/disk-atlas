name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      QUALITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run the same gate as contributors
        run: |
          atlas_xcode=$(python3 -c 'import json; print(json.load(open("quality/policy.json"))["xcode"])')
          export DEVELOPER_DIR="/Applications/Xcode_${atlas_xcode}.app/Contents/Developer"
          export PATH="/usr/bin:$PATH" # use the selected Xcode's Python/Swift shims
          scripts/check.sh --base "$QUALITY_BASE"
      - name: Upload the audit and mutation logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quality-report
          path: |
            .build/quality/report.json
            .build/quality/coverage.lcov
            .build/quality/scripts.lcov
            .build/quality/python-coverage.json
            .build/quality/mutations/*.log
          if-no-files-found: ignore
